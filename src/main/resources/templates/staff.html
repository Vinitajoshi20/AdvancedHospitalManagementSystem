<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Staff Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #eef3f8;
        }

        .container {
            width: 100%;
            max-width: 1150px;
            margin: 0 auto;
            background: white;
            padding: 45px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            color: #123b63;
            font-size: 36px;
            margin-bottom: 40px;
        }

        h2 {
            color: #123b63;
            font-size: 25px;
            margin-bottom: 25px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 50px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        input,
        select {
            width: 100%;
            height: 50px;
            padding: 12px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #1976d2;
        }

        .save-btn {
            width: 100%;
            height: 52px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .save-btn:hover {
            background: #125ca5;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 900px;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th {
            background: #123b63;
            color: white;
            padding: 16px;
            text-align: center;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #e2e8f0;
            text-align: center;
        }

        tr:hover td {
            background: #f7faff;
        }

        .edit-btn,
        .delete-btn {
            display: inline-block;
            padding: 9px 15px;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            margin: 2px;
        }

        .edit-btn {
            background: #1976d2;
        }

        .delete-btn {
            background: #dc3545;
        }

        .edit-btn:hover {
            background: #125ca5;
        }

        .delete-btn:hover {
            background: #b02a37;
        }

        .back-btn {
            display: block;
            width: 240px;
            margin: 40px auto 0;
            padding: 14px;
            text-align: center;
            background: #123b63;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
        }

        .back-btn:hover {
            background: #0d2d4b;
        }

        @media (max-width: 700px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 28px;
            }

            h2 {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Staff Management</h1>

    <h2>Add / Update Staff</h2>

    <form th:action="@{/staff}" th:object="${staff}" method="post">

        <div class="form-group">
            <label>Staff Name</label>
            <input type="text"
                   th:field="*{name}"
                   placeholder="Enter staff name"
                   required>
        </div>

        <div class="form-group">
            <label>Role</label>
            <select th:field="*{role}" required>
                <option value="">Select Role</option>
                <option value="Nurse">Nurse</option>
                <option value="Receptionist">Receptionist</option>
                <option value="Pharmacist">Pharmacist</option>
                <option value="Lab Technician">Lab Technician</option>
                <option value="Ward Staff">Ward Staff</option>
                <option value="Accountant">Accountant</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="form-group">
            <label>Department</label>
            <input type="text"
                   th:field="*{department}"
                   placeholder="Enter department"
                   required>
        </div>

        <div class="form-group">
            <label>Phone</label>
            <input type="text"
                   th:field="*{phone}"
                   placeholder="Enter phone number"
                   required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email"
                   th:field="*{email}"
                   placeholder="Enter email"
                   required>
        </div>

        <div class="form-group">
            <label>Address</label>
            <input type="text"
                   th:field="*{address}"
                   placeholder="Enter address">
        </div>

        <div class="form-group">
            <label>Status</label>
            <select th:field="*{status}" required>
                <option value="">Select Status</option>
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
                <option value="On Leave">On Leave</option>
            </select>
        </div>

        <button type="submit" class="save-btn">
            Save Staff
        </button>

    </form>

    <h2>Staff Records</h2>

    <div class="table-wrapper">

        <table>

            <thead>
            <tr>
                <th>ID</th>
                <th>Staff Name</th>
                <th>Role</th>
                <th>Department</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Address</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="staffItem : ${staffList}">

                <td th:text="${staffItem.id}"></td>

                <td th:text="${staffItem.name}"></td>

                <td th:text="${staffItem.role}"></td>

                <td th:text="${staffItem.department}"></td>

                <td th:text="${staffItem.phone}"></td>

                <td th:text="${staffItem.email}"></td>

                <td th:text="${staffItem.address}"></td>

                <td th:text="${staffItem.status}"></td>

                <td>
                    <a class="edit-btn"
                       th:href="@{/staff/edit/{id}(id=${staffItem.id})}">
                        Edit
                    </a>

                    <a class="delete-btn"
                       th:href="@{/staff/delete/{id}(id=${staffItem.id})}"
                       onclick="return confirm('Are you sure you want to delete this staff record?');">
                        Delete
                    </a>
                </td>

            </tr>

            <tr th:if="${#lists.isEmpty(staffList)}">
                <td colspan="9">
                    No staff records found.
                </td>
            </tr>

            </tbody>

        </table>

    </div>

    <a href="/dashboard" class="back-btn">
        Back to Dashboard
    </a>

</div>

</body>
</html>

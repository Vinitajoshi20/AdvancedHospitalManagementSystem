<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Billing Management</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            background:
                    linear-gradient(
                            rgba(8, 35, 65, 0.65),
                            rgba(8, 35, 65, 0.65)
                    ),
                    url('/images/hospital-bg.jpg');

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            padding: 35px 20px;
        }


        .container {
            width: 96%;
            max-width: 1200px;

            margin: auto;

            background: rgba(255,255,255,0.97);

            border-radius: 18px;

            padding: 35px;

            box-shadow:
                    0 15px 40px rgba(0,0,0,0.25);
        }


        /* HEADER */

        .header {
            text-align: center;

            margin-bottom: 30px;
        }

        .header h1 {
            color: #123f63;

            font-size: 31px;

            margin-bottom: 8px;
        }

        .header p {
            color: #777;

            font-size: 14px;
        }


        /* FORM */

        .form-card {

            background: #f8fafc;

            border: 1px solid #e1e8ee;

            border-radius: 14px;

            padding: 25px;

            margin-bottom: 35px;
        }


        .form-title {

            color: #123f63;

            font-size: 20px;

            margin-bottom: 20px;

            padding-bottom: 12px;

            border-bottom: 1px solid #dfe6ec;
        }


        .form-grid {

            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 17px;
        }


        .form-group {

            display: flex;

            flex-direction: column;
        }


        .form-group label {

            color: #40566b;

            font-size: 13px;

            font-weight: 600;

            margin-bottom: 7px;
        }


        .form-group input,
        .form-group select,
        .form-group textarea {

            padding: 11px 12px;

            border: 1px solid #ccd8e2;

            border-radius: 8px;

            outline: none;

            background: white;

            color: #333;

            font-size: 14px;
        }


        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {

            border-color: #7ea6c4;

            box-shadow:
                    0 0 0 3px rgba(126,166,196,0.12);
        }


        textarea {

            min-height: 85px;

            resize: vertical;
        }


        .full {

            grid-column: 1 / -1;
        }


        .button-area {

            margin-top: 22px;

            text-align: center;
        }


        .save-btn {

            border: none;

            background: #2f6f95;

            color: white;

            padding: 12px 30px;

            border-radius: 8px;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.25s;
        }


        .save-btn:hover {

            background: #245a7b;

            transform: translateY(-1px);
        }


        /* TABLE */

        .table-title {

            color: #123f63;

            font-size: 21px;

            margin-bottom: 18px;
        }


        .table-container {

            overflow-x: auto;

            border: 1px solid #e0e7ed;

            border-radius: 12px;
        }


        table {

            width: 100%;

            border-collapse: collapse;

            min-width: 1000px;
        }


        th {

            background: #edf4f8;

            color: #294b64;

            padding: 13px 12px;

            font-size: 13px;

            text-align: left;

            border-bottom: 1px solid #dce5eb;
        }


        td {

            padding: 13px 12px;

            color: #555;

            font-size: 13px;

            border-bottom: 1px solid #edf0f2;
        }


        tr:last-child td {

            border-bottom: none;
        }


        tr:hover td {

            background: #fafcfd;
        }


        /* STATUS */

        .status {

            display: inline-block;

            padding: 6px 11px;

            border-radius: 15px;

            font-size: 12px;

            font-weight: bold;

            background: #eef3f6;

            color: #456273;
        }


        /* ACTIONS */

        .action-link {

            text-decoration: none;

            padding: 6px 10px;

            border-radius: 6px;

            font-size: 12px;

            margin-right: 5px;
        }


        .edit {

            background: #eef5fa;

            color: #326889;
        }


        .delete {

            background: #fff0f0;

            color: #b54b4b;
        }


        /* EMPTY */

        .empty {

            text-align: center;

            padding: 45px;

            color: #777;
        }


        /* BACK */

        .back-section {

            text-align: center;

            margin-top: 32px;

            padding-top: 23px;

            border-top: 1px solid #e4e9ed;
        }


        .back-link {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            text-decoration: none;

            color: #365d78;

            background: #f3f7fa;

            border: 1px solid #dce6ed;

            padding: 11px 22px;

            border-radius: 9px;

            font-size: 14px;

            font-weight: 600;

            transition: 0.25s;
        }


        .back-link:hover {

            background: #e9f1f6;

            transform: translateY(-1px);
        }


        @media(max-width: 700px) {

            .container {
                padding: 22px 16px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            .header h1 {
                font-size: 26px;
            }
        }

    </style>

</head>


<body>


<div class="container">


    <!-- HEADER -->

    <div class="header">

        <h1>Billing Management</h1>

        <p>
            Create, manage and track patient billing information
        </p>

    </div>



    <!-- BILL FORM -->

    <div class="form-card">

        <div class="form-title">
            Create / Update Bill
        </div>


        <form th:action="@{/billing}"
              th:object="${bill}"
              method="post">


            <div class="form-grid">


                <div class="form-group">

                    <label>Patient ID</label>

                    <input type="number"
                           th:field="*{patientId}"
                           placeholder="Enter patient ID"
                           required>

                </div>


                <div class="form-group">

                    <label>Patient Name</label>

                    <input type="text"
                           th:field="*{patientName}"
                           placeholder="Enter patient name"
                           required>

                </div>


                <div class="form-group">

                    <label>Bill Date</label>

                    <input type="date"
                           th:field="*{billDate}"
                           required>

                </div>


                <div class="form-group">

                    <label>Bill Type</label>

                    <select th:field="*{billType}"
                            required>

                        <option value="">
                            Select Bill Type
                        </option>

                        <option value="Consultation">
                            Consultation
                        </option>

                        <option value="Medicine">
                            Medicine
                        </option>

                        <option value="Laboratory">
                            Laboratory
                        </option>

                        <option value="Room">
                            Room / Bed
                        </option>

                        <option value="Treatment">
                            Treatment
                        </option>

                        <option value="Hospitalization">
                            Hospitalization
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group full">

                    <label>Description</label>

                    <textarea
                            th:field="*{description}"
                            placeholder="Enter bill description">
                    </textarea>

                </div>


                <div class="form-group">

                    <label>Total Amount</label>

                    <input type="number"
                           step="0.01"
                           th:field="*{totalAmount}"
                           placeholder="Enter total amount"
                           required>

                </div>


                <div class="form-group">

                    <label>Paid Amount</label>

                    <input type="number"
                           step="0.01"
                           th:field="*{paidAmount}"
                           placeholder="Enter paid amount"
                           required>

                </div>


                <div class="form-group">

                    <label>Payment Method</label>

                    <select th:field="*{paymentMethod}">

                        <option value="">
                            Select Payment Method
                        </option>

                        <option value="Cash">
                            Cash
                        </option>

                        <option value="Card">
                            Card
                        </option>

                        <option value="UPI">
                            UPI
                        </option>

                        <option value="Online">
                            Online
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Payment Status</label>

                    <select th:field="*{paymentStatus}">

                        <option value="">
                            Auto Calculate
                        </option>

                        <option value="Paid">
                            Paid
                        </option>

                        <option value="Partially Paid">
                            Partially Paid
                        </option>

                        <option value="Pending">
                            Pending
                        </option>

                    </select>

                </div>


            </div>


            <div class="button-area">

                <button type="submit"
                        class="save-btn">

                    Save Bill

                </button>

            </div>


        </form>

    </div>



    <!-- BILL LIST -->

    <div class="table-title">
        Existing Bills
    </div>


    <div class="table-container"
         th:if="${bills != null and !bills.isEmpty()}">

        <table>

            <thead>

            <tr>

                <th>ID</th>

                <th>Patient</th>

                <th>Date</th>

                <th>Bill Type</th>

                <th>Total</th>

                <th>Paid</th>

                <th>Due</th>

                <th>Payment Method</th>

                <th>Status</th>

                <th>Action</th>

            </tr>

            </thead>


            <tbody>

            <tr th:each="bill : ${bills}">

                <td th:text="${bill.id}">
                    1
                </td>

                <td>

                    <strong th:text="${bill.patientName}">
                        Patient
                    </strong>

                    <br>

                    <small th:text="'ID: ' + ${bill.patientId}">
                        ID
                    </small>

                </td>

                <td th:text="${bill.billDate}">
                    Date
                </td>

                <td th:text="${bill.billType}">
                    Consultation
                </td>

                <td th:text="${bill.totalAmount}">
                    0
                </td>

                <td th:text="${bill.paidAmount}">
                    0
                </td>

                <td th:text="${bill.dueAmount}">
                    0
                </td>

                <td th:text="${bill.paymentMethod}">
                    Cash
                </td>

                <td>

                    <span class="status"
                          th:text="${bill.paymentStatus}">
                        Pending
                    </span>

                </td>

                <td>

                    <a class="action-link edit"
                       th:href="@{/billing/edit/{id}(id=${bill.id})}">
                        Edit
                    </a>

                    <a class="action-link delete"
                       th:href="@{/billing/delete/{id}(id=${bill.id})}"
                       onclick="return confirm('Are you sure you want to delete this bill?');">
                        Delete
                    </a>

                </td>

            </tr>

            </tbody>

        </table>

    </div>


    <!-- EMPTY -->

    <div class="empty"
         th:if="${bills == null or bills.isEmpty()}">

        No bills available.

    </div>



    <!-- BACK -->

    <div class="back-section">

        <a href="/dashboard"
           class="back-link">

            ← Back to Dashboard

        </a>

    </div>


</div>


</body>

</html>

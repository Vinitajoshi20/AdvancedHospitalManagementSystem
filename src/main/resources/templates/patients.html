<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patient Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(rgba(10, 35, 70, 0.78), rgba(10, 35, 70, 0.78)),
            url('/images/hospital-bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            padding: 35px 20px;
        }

        .container {
            width: 95%;
            max-width: 1250px;
            margin: auto;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;
            color: #0b3d6e;
            margin-bottom: 30px;
        }

        h2 {
            color: #0b3d6e;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .full {
            grid-column: span 2;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
            color: #333;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 14px;
        }

        textarea {
            min-height: 80px;
            resize: vertical;
        }

        .save-btn {
            margin-top: 25px;
            padding: 13px 35px;
            border: none;
            border-radius: 8px;
            background: #0b3d6e;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .save-btn:hover {
            background: #082d52;
        }

        .table-title {
            margin-top: 45px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #0b3d6e;
            color: white;
            padding: 12px;
        }

        td {
            padding: 11px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f4f8fc;
        }

        .action-btn {
            display: inline-block;
            padding: 7px 11px;
            margin: 2px;
            border-radius: 6px;
            color: white;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
        }

        .edit-btn {
            background: #1565c0;
        }

        .delete-btn {
            background: #c62828;
        }

        .back-btn {
            display: block;
            width: 210px;
            margin: 30px auto 0;
            padding: 12px;
            text-align: center;
            background: #0b3d6e;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .back-btn:hover {
            background: #082d52;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: span 1;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Patient Management</h1>

    <h2>Patient Details</h2>

    <form th:action="@{/patients}" th:object="${patient}" method="post">

        <input type="hidden" th:field="*{id}">

        <div class="form-grid">

            <div class="form-group">
                <label>Patient Name</label>
                <input type="text"
                       th:field="*{name}"
                       placeholder="Enter patient name"
                       required>
            </div>

            <div class="form-group">
                <label>Age</label>
                <input type="number"
                       th:field="*{age}"
                       min="0"
                       placeholder="Enter age"
                       required>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <select th:field="*{gender}" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Mobile Number</label>
                <input type="text"
                       th:field="*{phone}"
                       placeholder="Enter mobile number"
                       required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email"
                       th:field="*{email}"
                       placeholder="Enter email">
            </div>

            <div class="form-group">
                <label>Blood Group</label>
                <select th:field="*{bloodGroup}">
                    <option value="">Select Blood Group</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                </select>
            </div>

            <div class="form-group full">
                <label>Address</label>
                <textarea th:field="*{address}"
                          placeholder="Enter complete address"></textarea>
            </div>

            <div class="form-group">
                <label>Emergency Contact</label>
                <input type="text"
                       th:field="*{emergencyContact}"
                       placeholder="Emergency contact number">
            </div>

            <div class="form-group">
                <label>Patient Type</label>
                <select th:field="*{patientType}">
                    <option value="">Select Patient Type</option>
                    <option value="OPD">OPD</option>
                    <option value="IPD">IPD</option>
                </select>
            </div>

            <div class="form-group">
                <label>Admission Date</label>
                <input type="date"
                       th:field="*{admissionDate}">
            </div>

            <div class="form-group">
                <label>Room Number</label>
                <input type="text"
                       th:field="*{roomNumber}"
                       placeholder="Enter room number if admitted">
            </div>

            <div class="form-group">
                <label>Insurance Number</label>
                <input type="text"
                       th:field="*{insuranceNumber}"
                       placeholder="Optional">
            </div>

            <div class="form-group full">
                <label>Medical History</label>
                <textarea th:field="*{medicalHistory}"
                          placeholder="Previous diseases, surgeries, treatments, etc."></textarea>
            </div>

            <div class="form-group full">
                <label>Allergies</label>
                <textarea th:field="*{allergies}"
                          placeholder="Medicine, food or other allergies"></textarea>
            </div>

            <div class="form-group full">
                <label>Current Condition</label>
                <textarea th:field="*{currentCondition}"
                          placeholder="Current health condition"></textarea>
            </div>

        </div>

        <button type="submit" class="save-btn">
            Save Patient
        </button>

    </form>


    <h2 class="table-title">Patient List</h2>

    <div class="table-container">

        <table>

            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Gender</th>
                <th>Mobile</th>
                <th>Blood Group</th>
                <th>Patient Type</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="p : ${patients}">

                <td th:text="${p.id}"></td>

                <td th:text="${p.name}"></td>

                <td th:text="${p.age}"></td>

                <td th:text="${p.gender}"></td>

                <td th:text="${p.phone}"></td>

                <td th:text="${p.bloodGroup}"></td>

                <td th:text="${p.patientType}"></td>

                <td>
                    <a th:href="@{'/patients/edit/' + ${p.id}}"
                       class="action-btn edit-btn">
                        Edit
                    </a>

                    <a th:href="@{'/patients/delete/' + ${p.id}}"
                       class="action-btn delete-btn"
                       onclick="return confirm('Are you sure you want to delete this patient?');">
                        Delete
                    </a>
                </td>

            </tr>

            <tr th:if="${#lists.isEmpty(patients)}">
                <td colspan="8">
                    No patients found.
                </td>
            </tr>

            </tbody>

        </table>

    </div>

    <a href="/dashboard" class="back-btn">
        Back to Dashboard
    </a>

</div>

</body>
</html>

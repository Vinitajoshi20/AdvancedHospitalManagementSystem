<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Room & Bed Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #eef3f8;
        }

        .container {
            width: 100%;
            max-width: 1150px;
            margin: 0 auto;
            background: white;
            padding: 45px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            color: #123b63;
            font-size: 36px;
            margin-bottom: 40px;
        }

        h2 {
            color: #123b63;
            font-size: 25px;
            margin-bottom: 25px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 50px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        input,
        select {
            width: 100%;
            height: 50px;
            padding: 12px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #1976d2;
        }

        button {
            width: 100%;
            height: 52px;
            margin-top: 5px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #125ca5;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 900px;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th {
            background: #123b63;
            color: white;
            padding: 16px;
            text-align: center;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #e2e8f0;
            text-align: center;
        }

        tr:hover td {
            background: #f7faff;
        }

        .edit-btn,
        .delete-btn {
            display: inline-block;
            padding: 9px 15px;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            margin: 2px;
        }

        .edit-btn {
            background: #1976d2;
        }

        .delete-btn {
            background: #dc3545;
        }

        .edit-btn:hover {
            background: #125ca5;
        }

        .delete-btn:hover {
            background: #b02a37;
        }

        .dashboard-btn {
            display: block;
            width: 240px;
            margin: 40px auto 0;
            padding: 14px;
            text-align: center;
            background: #123b63;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
        }

        .dashboard-btn:hover {
            background: #0d2d4b;
        }

        @media (max-width: 700px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 28px;
            }

            h2 {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Room & Bed Management</h1>

    <h2>Add / Update Room & Bed</h2>

    <form th:action="@{/rooms}" th:object="${room}" method="post">

        <div class="form-group">
            <label>Room Number</label>
            <input type="text"
                   th:field="*{roomNumber}"
                   placeholder="Enter room number"
                   required>
        </div>

        <div class="form-group">
            <label>Bed Number</label>
            <input type="text"
                   th:field="*{bedNumber}"
                   placeholder="Enter bed number"
                   required>
        </div>

        <div class="form-group">
            <label>Total Beds</label>
            <input type="number"
                   th:field="*{totalBeds}"
                   placeholder="Enter total beds"
                   min="1"
                   required>
        </div>

        <div class="form-group">
            <label>Room Type</label>
            <select th:field="*{roomType}" required>
                <option value="">Select Room Type</option>
                <option value="General">General</option>
                <option value="Private">Private</option>
                <option value="Semi-Private">Semi-Private</option>
                <option value="ICU">ICU</option>
                <option value="Emergency">Emergency</option>
            </select>
        </div>

        <div class="form-group">
            <label>Patient Name</label>
            <input type="text"
                   th:field="*{patientName}"
                   placeholder="Enter patient name">
        </div>

        <div class="form-group">
            <label>Status</label>
            <select th:field="*{status}" required>
                <option value="">Select Status</option>
                <option value="Available">Available</option>
                <option value="Occupied">Occupied</option>
                <option value="Reserved">Reserved</option>
                <option value="Maintenance">Maintenance</option>
            </select>
        </div>

        <button type="submit">
            Save Room & Bed
        </button>

    </form>

    <h2>Room & Bed Records</h2>

    <div class="table-wrapper">

        <table>

            <thead>
            <tr>
                <th>ID</th>
                <th>Room Number</th>
                <th>Bed Number</th>
                <th>Total Beds</th>
                <th>Room Type</th>
                <th>Patient Name</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="roomItem : ${rooms}">

                <td th:text="${roomItem.id}"></td>

                <td th:text="${roomItem.roomNumber}"></td>

                <td th:text="${roomItem.bedNumber}"></td>

                <td th:text="${roomItem.totalBeds}"></td>

                <td th:text="${roomItem.roomType}"></td>

                <td th:text="${roomItem.patientName}"></td>

                <td th:text="${roomItem.status}"></td>

                <td>
                    <a class="edit-btn"
                       th:href="@{'/rooms/edit/' + ${roomItem.id}}">
                        Edit
                    </a>

                    <a class="delete-btn"
                       th:href="@{'/rooms/delete/' + ${roomItem.id}}"
                       onclick="return confirm('Are you sure you want to delete this room and bed record?');">
                        Delete
                    </a>
                </td>

            </tr>

            <tr th:if="${#lists.isEmpty(rooms)}">
                <td colspan="8">No room records found.</td>
            </tr>

            </tbody>

        </table>

    </div>

    <a href="/dashboard" class="dashboard-btn">
        Back to Dashboard
    </a>

</div>

</body>
</html>

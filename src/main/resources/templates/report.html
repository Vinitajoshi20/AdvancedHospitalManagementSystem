<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report Generation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
        }

        h1 {
            text-align: center;
            color: #123c69;
            margin-bottom: 30px;
        }

        h2 {
            color: #123c69;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd5e0;
            border-radius: 7px;
            font-size: 15px;
        }

        .btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #1769aa;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn:hover {
            background: #0f4f82;
        }

        .success {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #123c69;
            color: white;
        }

        tr:nth-child(even) {
            background: #f8fafc;
        }

        .back-container {
            text-align: center;
            margin-top: 25px;
            margin-bottom: 20px;
        }

        .back-btn {
            display: inline-block;
            padding: 12px 25px;
            background: #123c69;
            color: white;
            text-decoration: none;
            border-radius: 7px;
            font-weight: bold;
        }

        .back-btn:hover {
            background: #0d2d4d;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- Report Generation Form -->
    <div class="card">

        <h1>Report Generation</h1>

        <div class="success"
             th:if="${message}"
             th:text="${message}">
            Report generated and saved successfully!
        </div>

        <form action="/reports/generate" method="post">

            <div class="form-group">

                <label>Report Type</label>

                <select name="reportType" required>

                    <option value="">Select Report Type</option>

                    <option value="Patient Report">
                        Patient Report
                    </option>

                    <option value="Doctor Report">
                        Doctor Report
                    </option>

                    <option value="Appointment Report">
                        Appointment Report
                    </option>

                    <option value="Medical Report">
                        Medical Report
                    </option>

                    <option value="Billing Report">
                        Billing Report
                    </option>

                    <option value="Pharmacy Report">
                        Pharmacy Report
                    </option>

                    <option value="Laboratory Report">
                        Laboratory Report
                    </option>

                    <option value="Room & Bed Report">
                        Room & Bed Report
                    </option>

                    <option value="Staff Report">
                        Staff Report
                    </option>

                    <option value="Department Report">
                        Department Report
                    </option>

                </select>

            </div>

            <div class="form-group">

                <label>From Date</label>

                <input type="date"
                       name="fromDate"
                       required>

            </div>

            <div class="form-group">

                <label>To Date</label>

                <input type="date"
                       name="toDate"
                       required>

            </div>

            <button type="submit" class="btn">
                Generate Report
            </button>

        </form>

    </div>


    <!-- Saved Reports -->
    <div class="card">

        <h2>Saved Reports</h2>

        <div class="table-container">

            <table>

                <thead>

                <tr>
                    <th>ID</th>
                    <th>Report Type</th>
                    <th>From Date</th>
                    <th>To Date</th>
                </tr>

                </thead>

                <tbody>

                <tr th:each="report : ${reports}">

                    <td th:text="${report.id}">
                        1
                    </td>

                    <td th:text="${report.reportType}">
                        Patient Report
                    </td>

                    <td th:text="${report.fromDate}">
                        2026-09-01
                    </td>

                    <td th:text="${report.toDate}">
                        2026-09-06
                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(reports)}">

                    <td colspan="4"
                        style="text-align: center;">
                        No report generated yet.
                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>


    <!-- Back to Dashboard -->
    <div class="back-container">

        <a href="/dashboard" class="back-btn">
            Back to Dashboard
        </a>

    </div>

</div>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Hospital Management System</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            font-family: Arial, sans-serif;

            background-image:
                    linear-gradient(
                            rgba(5, 35, 70, 0.48),
                            rgba(5, 35, 70, 0.48)
                    ),
                    url("https://images.unsplash.com/photo-1586773860418-d37222d8fce3?auto=format&fit=crop&w=2000&q=85");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

        }


        .content {

            width: 90%;

            max-width: 900px;

            color: white;

        }


        .hospital-icon {

            font-size: 65px;

            margin-bottom: 18px;

            text-shadow:
                    0 3px 10px rgba(0,0,0,0.4);

        }


        h1 {

            font-size: 48px;

            font-weight: bold;

            margin-bottom: 18px;

            text-shadow:
                    0 3px 12px rgba(0,0,0,0.5);

        }


        .subtitle {

            font-size: 23px;

            font-weight: 500;

            margin-bottom: 12px;

            text-shadow:
                    0 2px 8px rgba(0,0,0,0.5);

        }


        .description {

            font-size: 16px;

            line-height: 1.6;

            max-width: 700px;

            margin: 0 auto 35px;

            text-shadow:
                    0 2px 6px rgba(0,0,0,0.5);

        }


        .button-area {

            display: flex;

            justify-content: center;

            gap: 18px;

        }


        .btn {

            min-width: 150px;

            padding: 14px 32px;

            border-radius: 7px;

            text-decoration: none;

            font-size: 16px;

            font-weight: bold;

            transition: 0.25s;

        }


        .login-btn {

            background: #0b2d5c;

            color: white;

            border: 2px solid #0b2d5c;

        }


        .login-btn:hover {

            background: #082344;

            border-color: #082344;

            transform: translateY(-3px);

        }


        .register-btn {

            background: white;

            color: #0b2d5c;

            border: 2px solid white;

        }


        .register-btn:hover {

            background: #eef4fb;

            transform: translateY(-3px);

        }


        .footer {

            margin-top: 35px;

            font-size: 13px;

            color: rgba(255,255,255,0.9);

            text-shadow:
                    0 2px 5px rgba(0,0,0,0.5);

        }


        @media (max-width: 600px) {

            h1 {

                font-size: 32px;

            }

            .subtitle {

                font-size: 19px;

            }

            .description {

                font-size: 14px;

            }

            .button-area {

                flex-direction: column;

                align-items: center;

            }

            .btn {

                width: 200px;

            }

        }

    </style>

</head>


<body>


<div class="content">


    <div class="hospital-icon">
        🏥
    </div>


    <h1>
        Welcome to Our Hospital
        Management System
    </h1>


    <div class="subtitle">
        Your Health, Our Priority
    </div>


    <div class="description">

        A modern and efficient healthcare management
        system designed to provide better hospital
        services and patient care.

    </div>


    <div class="button-area">

        <a href="/login" class="btn login-btn">
            Login
        </a>

        <a href="/register" class="btn register-btn">
            Register
        </a>

    </div>


    <div class="footer">

        Secure • Efficient • Professional Healthcare Management

    </div>


</div>


</body>

</html>

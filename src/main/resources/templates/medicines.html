<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Medicine Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #eef3f8;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            background: white;
            padding: 45px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            color: #123b63;
            font-size: 34px;
            margin-bottom: 35px;
        }

        h2 {
            color: #123b63;
            font-size: 24px;
            margin-bottom: 22px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-bottom: 45px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th {
            background: #123b63;
            color: white;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 13px;
            border-bottom: 1px solid #ddd;
        }

        .edit-btn,
        .delete-btn {
            display: inline-block;
            padding: 8px 14px;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
        }

        .edit-btn {
            background: #1976d2;
        }

        .delete-btn {
            background: #dc3545;
        }

        .dashboard {
            display: block;
            width: fit-content;
            margin: 35px auto 0;
            padding: 12px 25px;
            background: #123b63;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Medicine Management</h1>

    <h2>Add / Update Medicine</h2>

    <form th:action="@{/medicines}"
          th:object="${medicine}"
          method="post">

        <div class="form-group">
            <label>Medicine Name</label>
            <input type="text"
                   th:field="*{name}"
                   placeholder="Enter medicine name"
                   required>
        </div>

        <div class="form-group">
            <label>Medicine Type</label>
            <input type="text"
                   th:field="*{type}"
                   placeholder="Enter medicine type"
                   required>
        </div>

        <div class="form-group">
            <label>Quantity</label>
            <input type="number"
                   th:field="*{quantity}"
                   placeholder="Enter quantity"
                   required>
        </div>

        <div class="form-group">
            <label>Price</label>
            <input type="number"
                   step="0.01"
                   th:field="*{price}"
                   placeholder="Enter price"
                   required>
        </div>

        <div class="form-group">
            <label>Status</label>
            <select th:field="*{status}" required>
                <option value="">Select Status</option>
                <option value="Available">Available</option>
                <option value="Out of Stock">Out of Stock</option>
            </select>
        </div>

        <button type="submit">
            Save Medicine
        </button>

    </form>

    <h2>Medicine Records</h2>

    <table>

        <thead>
        <tr>
            <th>ID</th>
            <th>Medicine Name</th>
            <th>Type</th>
            <th>Quantity</th>
            <th>Price</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="medicineItem : ${medicines}">

            <td th:text="${medicineItem.id}"></td>
            <td th:text="${medicineItem.name}"></td>
            <td th:text="${medicineItem.type}"></td>
            <td th:text="${medicineItem.quantity}"></td>
            <td th:text="${medicineItem.price}"></td>
            <td th:text="${medicineItem.status}"></td>

            <td>

                <a class="edit-btn"
                   th:href="@{'/medicines/edit/' + ${medicineItem.id}}">
                    Edit
                </a>

                <a class="delete-btn"
                   th:href="@{'/medicines/delete/' + ${medicineItem.id}}"
                   onclick="return confirm('Are you sure you want to delete this medicine?');">
                    Delete
                </a>

            </td>

        </tr>

        </tbody>

    </table>

    <a href="/dashboard" class="dashboard">
        Back to Dashboard
    </a>

</div>

</body>
</html>

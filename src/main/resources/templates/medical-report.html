<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Medical Reports</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
        }

        h1 {
            text-align: center;
            color: #123c69;
            margin-bottom: 30px;
        }

        h2 {
            color: #123c69;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd5e0;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #1769aa;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn:hover {
            background: #0f4f82;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
            vertical-align: top;
        }

        th {
            background: #123c69;
            color: white;
        }

        tr:nth-child(even) {
            background: #f8fafc;
        }

        .action-btn {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 5px;
            text-decoration: none;
            color: white;
            margin-right: 5px;
            font-size: 13px;
        }

        .edit {
            background: #198754;
        }

        .delete {
            background: #dc3545;
        }

        .back-btn {
            display: inline-block;
            padding: 12px 25px;
            background: #123c69;
            color: white;
            text-decoration: none;
            border-radius: 7px;
            font-weight: bold;
        }

        .back-btn:hover {
            background: #0d2d4d;
        }

        .back-container {
            text-align: center;
            margin-top: 25px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- Medical Report Form -->
    <div class="card">

        <h1>Medical Report Management</h1>

        <form th:action="@{/medical-reports}"
              th:object="${medicalReport}"
              method="post">

            <!-- Patient -->
            <div class="form-group">
                <label>Patient Name</label>

                <select th:field="*{patient}" required>
                    <option value="">Select Patient</option>

                    <option th:each="patient : ${patients}"
                            th:value="${patient.id}"
                            th:text="${patient.name}">
                    </option>
                </select>
            </div>

            <!-- Doctor -->
            <div class="form-group">
                <label>Doctor Name</label>

                <select th:field="*{doctor}" required>
                    <option value="">Select Doctor</option>

                    <option th:each="doctor : ${doctors}"
                            th:value="${doctor.id}"
                            th:text="${doctor.name}">
                    </option>
                </select>
            </div>

            <!-- Report Type -->
            <div class="form-group">
                <label>Report Type</label>

                <select th:field="*{reportType}" required>
                    <option value="">Select Report Type</option>
                    <option value="Blood Test">Blood Test</option>
                    <option value="X-Ray">X-Ray</option>
                    <option value="MRI">MRI</option>
                    <option value="CT Scan">CT Scan</option>
                    <option value="General Checkup">General Checkup</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <!-- Report Date -->
            <div class="form-group">
                <label>Report Date</label>

                <input type="date"
                       th:field="*{reportDate}"
                       required>
            </div>

            <!-- Findings -->
            <div class="form-group">
                <label>Findings</label>

                <textarea th:field="*{findings}"
                          placeholder="Enter medical findings"
                          required></textarea>
            </div>

            <!-- Diagnosis -->
            <div class="form-group">
                <label>Diagnosis</label>

                <textarea th:field="*{diagnosis}"
                          placeholder="Enter diagnosis"
                          required></textarea>
            </div>

            <!-- Treatment -->
            <div class="form-group">
                <label>Treatment</label>

                <textarea th:field="*{treatment}"
                          placeholder="Enter treatment details"
                          required></textarea>
            </div>

            <button type="submit" class="btn">
                Save Medical Report
            </button>

        </form>

    </div>


    <!-- Saved Medical Reports -->
    <div class="card">

        <h2>Saved Medical Reports</h2>

        <div class="table-container">

            <table>

                <thead>
                <tr>
                    <th>ID</th>
                    <th>Patient</th>
                    <th>Doctor</th>
                    <th>Report Type</th>
                    <th>Report Date</th>
                    <th>Findings</th>
                    <th>Diagnosis</th>
                    <th>Treatment</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="report : ${medicalReports}">

                    <td th:text="${report.id}"></td>

                    <td th:text="${report.patient != null ? report.patient.name : 'N/A'}"></td>

                    <td th:text="${report.doctor != null ? report.doctor.name : 'N/A'}"></td>

                    <td th:text="${report.reportType}"></td>

                    <td th:text="${report.reportDate}"></td>

                    <td th:text="${report.findings}"></td>

                    <td th:text="${report.diagnosis}"></td>

                    <td th:text="${report.treatment}"></td>

                    <td>

                        <a th:href="@{/medical-reports/edit/{id}(id=${report.id})}"
                           class="action-btn edit">
                            Edit
                        </a>

                        <a th:href="@{/medical-reports/delete/{id}(id=${report.id})}"
                           class="action-btn delete"
                           onclick="return confirm('Are you sure you want to delete this medical report?');">
                            Delete
                        </a>

                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(medicalReports)}">

                    <td colspan="9" style="text-align: center;">
                        No medical reports available.
                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>


    <!-- Back to Dashboard -->
    <div class="back-container">

        <a href="/dashboard" class="back-btn">
            Back to Dashboard
        </a>

    </div>

</div>

</body>
</html>

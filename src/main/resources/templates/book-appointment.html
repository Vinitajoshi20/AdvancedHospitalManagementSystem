<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Appointment</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;

            background:
                    linear-gradient(
                            rgba(0, 60, 100, 0.55),
                            rgba(0, 30, 60, 0.65)
                    ),
                    url("https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=1920&q=80");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 20px;
        }

        .page-container {
            width: 100%;
            max-width: 1050px;

            display: grid;
            grid-template-columns: 1fr 1.2fr;

            gap: 35px;

            align-items: center;
        }

        .intro-section {
            color: white;
            padding: 20px;
        }

        .intro-section h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .intro-section p {
            font-size: 18px;
            line-height: 1.6;
        }

        .appointment-card {
            background: rgba(255, 255, 255, 0.96);

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                    0 15px 40px rgba(0, 0, 0, 0.25);

            width: 100%;
        }

        .appointment-card h2 {
            text-align: center;

            color: #063b63;

            margin-top: 0;
            margin-bottom: 25px;

            font-size: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #173f5f;
        }

        input,
        select,
        textarea {
            width: 100%;

            padding: 12px 14px;

            border: 1px solid #cbd5e1;

            border-radius: 8px;

            font-size: 15px;

            background: white;

            color: #1f2937;

            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #1769aa;

            box-shadow:
                    0 0 0 3px rgba(23, 105, 170, 0.12);
        }

        input[readonly] {
            background: #f1f5f9;

            cursor: not-allowed;
        }

        select {
            cursor: pointer;
        }

        textarea {
            resize: vertical;

            min-height: 100px;
        }

        .button-row {
            display: flex;

            gap: 12px;

            margin-top: 25px;
        }

        button,
        .back-button {
            flex: 1;

            padding: 13px;

            border: none;

            border-radius: 8px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            text-align: center;

            text-decoration: none;
        }

        .book-button {
            background: #0b5fa5;

            color: white;
        }

        .book-button:hover {
            background: #084b82;
        }

        .back-button {
            background: #e2e8f0;

            color: #1e293b;
        }

        .back-button:hover {
            background: #cbd5e1;
        }

        @media (max-width: 800px) {

            .page-container {
                grid-template-columns: 1fr;
            }

            .intro-section {
                text-align: center;
            }

            .intro-section h1 {
                font-size: 32px;
            }

        }

    </style>
</head>

<body>

<div class="page-container">

    <!-- LEFT SIDE -->
    <div class="intro-section">

        <h1>Book Your Appointment</h1>

        <p>
            Schedule your appointment with one of our available
            doctors. Select your preferred doctor, date and time
            and submit your appointment request.
        </p>

    </div>


    <!-- RIGHT SIDE -->
    <div class="appointment-card">

        <h2>📅 Appointment Booking</h2>

        <form th:action="@{/book-appointment}"
              th:object="${appointment}"
              method="post">

            <!-- PATIENT NAME -->
            <div class="form-group">

                <label for="patientName">
                    Patient Name
                </label>

                <input
                        type="text"
                        id="patientName"
                        th:field="*{patientName}"
                        readonly>
            </div>


            <!-- DOCTOR NAME -->
            <div class="form-group">

                <label for="doctorName">
                    Select Available Doctor
                </label>

                <select
                        id="doctorName"
                        th:field="*{doctorName}"
                        required>

                    <option value="">
                        -- Select Doctor --
                    </option>

                    <option
                            th:each="doctor : ${availableDoctors}"
                            th:value="${doctor.name}"
                            th:text="${doctor.name + ' - ' + doctor.specialization}">
                    </option>

                </select>

            </div>


            <!-- APPOINTMENT DATE -->
            <div class="form-group">

                <label for="appointmentDate">
                    Appointment Date
                </label>

                <input
                        type="date"
                        id="appointmentDate"
                        th:field="*{appointmentDate}"
                        required>

            </div>


            <!-- APPOINTMENT TIME -->
            <div class="form-group">

                <label for="appointmentTime">
                    Appointment Time
                </label>

                <input
                        type="time"
                        id="appointmentTime"
                        th:field="*{appointmentTime}"
                        required>

            </div>


            <!-- REASON -->
            <div class="form-group">

                <label for="reason">
                    Reason for Appointment
                </label>

                <textarea
                        id="reason"
                        th:field="*{reason}"
                        placeholder="Enter reason for appointment"
                        required>
                </textarea>

            </div>


            <!-- BUTTONS -->
            <div class="button-row">

                <button
                        type="submit"
                        class="book-button">
                    Book Appointment
                </button>

                <a
                        href="/dashboard"
                        class="back-button">
                    Back to Dashboard
                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Laboratory Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #eef3f8;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            background: white;
            padding: 45px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            color: #123b63;
            margin-bottom: 35px;
            font-size: 34px;
        }

        h2 {
            color: #123b63;
            margin-bottom: 22px;
            font-size: 24px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-bottom: 45px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            font-family: Arial, sans-serif;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #1976d2;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 5px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #125ea8;
        }

        .table-section {
            margin-top: 20px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            min-width: 950px;
        }

        th {
            background: #123b63;
            color: white;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 13px;
            border-bottom: 1px solid #ddd;
            vertical-align: top;
        }

        tr:hover {
            background: #f5f9fd;
        }

        .edit-btn {
            display: inline-block;
            padding: 8px 14px;
            background: #1976d2;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            margin-right: 5px;
        }

        .edit-btn:hover {
            background: #125ea8;
        }

        .delete-btn {
            display: inline-block;
            padding: 8px 14px;
            background: #dc3545;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
        }

        .delete-btn:hover {
            background: #b02a37;
        }

        .dashboard {
            display: block;
            width: fit-content;
            margin: 35px auto 0;
            padding: 12px 25px;
            background: #123b63;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .dashboard:hover {
            background: #0d2d4b;
        }

        @media (max-width: 700px) {

            .container {
                padding: 25px;
            }

            h1 {
                font-size: 28px;
            }

            h2 {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Laboratory Management</h1>

    <h2>Add / Update Laboratory Test</h2>

    <form th:action="@{/laboratory}"
          th:object="${laboratory}"
          method="post">

        <div class="form-group">
            <label>Patient Name</label>
            <input type="text"
                   th:field="*{patientName}"
                   placeholder="Enter patient name"
                   required>
        </div>

        <div class="form-group">
            <label>Test Name</label>
            <input type="text"
                   th:field="*{testName}"
                   placeholder="Enter laboratory test name"
                   required>
        </div>

        <div class="form-group">
            <label>Test Date</label>
            <input type="date"
                   th:field="*{testDate}"
                   required>
        </div>

        <div class="form-group">
            <label>Test Result</label>
            <textarea th:field="*{result}"
                      placeholder="Enter test result"
                      required></textarea>
        </div>

        <div class="form-group">
            <label>Status</label>
            <select th:field="*{status}" required>
                <option value="">Select status</option>
                <option value="Pending">Pending</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
            </select>
        </div>

        <button type="submit">Save Laboratory Test</button>

    </form>

    <div class="table-section">

        <h2>Laboratory Records</h2>

        <div class="table-wrapper">

            <table>

                <thead>
                <tr>
                    <th>ID</th>
                    <th>Patient Name</th>
                    <th>Test Name</th>
                    <th>Test Date</th>
                    <th>Test Result</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="laboratory : ${laboratories}">

                    <td th:text="${laboratory.id}"></td>

                    <td th:text="${laboratory.patientName}"></td>

                    <td th:text="${laboratory.testName}"></td>

                    <td th:text="${laboratory.testDate}"></td>

                    <td th:text="${laboratory.result}"></td>

                    <td th:text="${laboratory.status}"></td>

                    <td>
                        <a class="edit-btn"
                           th:href="@{'/laboratory/edit/' + ${laboratory.id}}">
                            Edit
                        </a>

                        <a class="delete-btn"
                           th:href="@{'/laboratory/delete/' + ${laboratory.id}}"
                           onclick="return confirm('Are you sure you want to delete this laboratory record?');">
                            Delete
                        </a>
                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

    <a href="/dashboard" class="dashboard">
        Back to Dashboard
    </a>

</div>

</body>
</html>
